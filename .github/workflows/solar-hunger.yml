name: ☀️ Solar Hunger — Sun Eats Your Commits

on:
  schedule:
    # Runs every 24 hours at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository 📁
        uses: actions/checkout@v4

      - name: Generate Contribution Snake 🌞
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23FFD700

      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Transform Snake to Glowing Sun ☀️
        run: python scripts/transform_sun.py

      - name: Push Snake to Output Branch 🚀
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


