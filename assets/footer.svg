<svg xmlns="http://www.w3.org/2000/svg"
width="1600"
height="220"
viewBox="0 0 1600 220">

<defs>

<linearGradient id="bg"
x1="0%"
y1="0%"
x2="100%"
y2="0%">

<stop offset="0%" stop-color="#020617"/>
<stop offset="50%" stop-color="#111827"/>
<stop offset="100%" stop-color="#312E81"/>

</linearGradient>

<linearGradient id="wave"
x1="0%"
y1="0%"
x2="100%"
y2="0%">

<stop offset="0%" stop-color="#8B5CF6"/>
<stop offset="50%" stop-color="#C084FC"/>
<stop offset="100%" stop-color="#8B5CF6"/>

</linearGradient>

</defs>

<rect
width="1600"
height="220"
fill="url(#bg)"/>

<!-- Animated Wave -->

<path
fill="url(#wave)"
opacity=".25">

<animate
attributeName="d"
dur="10s"
repeatCount="indefinite"

values="
M0 130 C300 70 600 180 900 120 C1200 60 1450 170 1600 110 L1600 220 L0 220 Z;

M0 110 C300 160 600 80 900 150 C1200 190 1450 90 1600 130 L1600 220 L0 220 Z;

M0 130 C300 70 600 180 900 120 C1200 60 1450 170 1600 110 L1600 220 L0 220 Z"/>

</path>

<!-- Stars -->

<g fill="white">

<circle cx="150" cy="60" r="2">
<animate attributeName="opacity"
values="1;.2;1"
dur="2s"
repeatCount="indefinite"/>
</circle>

<circle cx="420" cy="90" r="2">
<animate attributeName="opacity"
values=".2;1;.2"
dur="3s"
repeatCount="indefinite"/>
</circle>

<circle cx="720" cy="50" r="2">
<animate attributeName="opacity"
values="1;.3;1"
dur="4s"
repeatCount="indefinite"/>
</circle>

<circle cx="980" cy="95" r="2">
<animate attributeName="opacity"
values=".3;1;.3"
dur="5s"
repeatCount="indefinite"/>
</circle>

<circle cx="1280" cy="55" r="2">
<animate attributeName="opacity"
values="1;.2;1"
dur="3s"
repeatCount="indefinite"/>
</circle>

<circle cx="1490" cy="90" r="2">
<animate attributeName="opacity"
values=".2;1;.2"
dur="4s"
repeatCount="indefinite"/>
</circle>

</g>

<!-- Center Glow -->

<circle
cx="800"
cy="150"
r="12"
fill="#DDD6FE">

<animate
attributeName="r"
values="12;18;12"
dur="3s"
repeatCount="indefinite"/>

</circle>

<!-- Quote -->

<text
x="800"
y="190"
text-anchor="middle"
font-size="18"
font-family="Segoe UI"
fill="#CBD5E1">

Thanks for visiting my universe ✨

</text>

</svg>