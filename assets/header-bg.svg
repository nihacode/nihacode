<svg xmlns="http://www.w3.org/2000/svg"
width="1600"
height="320"
viewBox="0 0 1600 320">

<defs>

<linearGradient id="bg"
x1="0%"
y1="0%"
x2="100%"
y2="100%">

<stop offset="0%" stop-color="#020617"/>
<stop offset="30%" stop-color="#111827"/>
<stop offset="65%" stop-color="#1E1B4B"/>
<stop offset="100%" stop-color="#312E81"/>

</linearGradient>

<radialGradient id="nebulaPurple">
<stop offset="0%" stop-color="#A855F7" stop-opacity=".35"/>
<stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
</radialGradient>

<radialGradient id="nebulaBlue">
<stop offset="0%" stop-color="#3B82F6" stop-opacity=".30"/>
<stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
</radialGradient>

<filter id="glow">
<feGaussianBlur stdDeviation="10"/>
</filter>

</defs>

<rect width="1600" height="320" fill="url(#bg)"/>

<!-- Purple Nebula -->

<circle
cx="420"
cy="90"
r="180"
fill="url(#nebulaPurple)"
filter="url(#glow)">

<animate
attributeName="r"
values="170;220;170"
dur="20s"
repeatCount="indefinite"/>

</circle>

<!-- Blue Nebula -->

<circle
cx="1180"
cy="210"
r="220"
fill="url(#nebulaBlue)"
filter="url(#glow)">

<animate
attributeName="r"
values="220;260;220"
dur="18s"
repeatCount="indefinite"/>

</circle>

<!-- Aurora -->

<ellipse
cx="800"
cy="70"
rx="760"
ry="80"
fill="#8B5CF6"
opacity=".05">

<animate
attributeName="opacity"
values=".03;.08;.03"
dur="12s"
repeatCount="indefinite"/>

</ellipse>

<!-- Twinkling Stars -->

<g fill="white">

<circle cx="90" cy="55" r="2">
<animate attributeName="opacity" values="1;.2;1" dur="2.5s" repeatCount="indefinite"/>
</circle>

<circle cx="220" cy="145" r="2">
<animate attributeName="opacity" values=".3;1;.3" dur="3.5s" repeatCount="indefinite"/>
</circle>

<circle cx="390" cy="65" r="2">
<animate attributeName="opacity" values="1;.4;1" dur="4.2s" repeatCount="indefinite"/>
</circle>

<circle cx="570" cy="175" r="2">
<animate attributeName="opacity" values=".2;1;.2" dur="5s" repeatCount="indefinite"/>
</circle>

<circle cx="760" cy="40" r="2">
<animate attributeName="opacity" values="1;.3;1" dur="3s" repeatCount="indefinite"/>
</circle>

<circle cx="920" cy="130" r="2">
<animate attributeName="opacity" values=".2;1;.2" dur="4.8s" repeatCount="indefinite"/>
</circle>

<circle cx="1110" cy="55" r="2">
<animate attributeName="opacity" values="1;.3;1" dur="5.5s" repeatCount="indefinite"/>
</circle>

<circle cx="1280" cy="170" r="2">
<animate attributeName="opacity" values=".3;1;.3" dur="4.5s" repeatCount="indefinite"/>
</circle>

<circle cx="1470" cy="60" r="2">
<animate attributeName="opacity" values="1;.2;1" dur="3.5s" repeatCount="indefinite"/>
</circle>

</g>

<!-- Shooting Star -->

<line
x1="180"
y1="40"
x2="330"
y2="140"
stroke="white"
stroke-width="2"
opacity="0">

<animate
attributeName="opacity"
values="0;1;0"
dur="7s"
repeatCount="indefinite"/>

<animate
attributeName="x1"
values="180;1050"
dur="7s"
repeatCount="indefinite"/>

<animate
attributeName="x2"
values="330;1200"
dur="7s"
repeatCount="indefinite"/>

</line>

<!-- Floating Particles -->

<g fill="#DDD6FE">

<circle cx="260" cy="260" r="2">
<animate attributeName="cy" values="260;240;260" dur="6s" repeatCount="indefinite"/>
</circle>

<circle cx="620" cy="270" r="2">
<animate attributeName="cy" values="270;245;270" dur="8s" repeatCount="indefinite"/>
</circle>

<circle cx="970" cy="250" r="2">
<animate attributeName="cy" values="250;230;250" dur="7s" repeatCount="indefinite"/>
</circle>

<circle cx="1330" cy="275" r="2">
<animate attributeName="cy" values="275;250;275" dur="9s" repeatCount="indefinite"/>
</circle>

</g>

</svg>