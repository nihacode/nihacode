<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500">

  <defs>
    <!-- Background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>

    <!-- Moon Glow -->
    <radialGradient id="moonGlow">
      <stop offset="0%" stop-color="#E9D5FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E9D5FF" stop-opacity="0"/>
    </radialGradient>

    <!-- Text Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="500" fill="url(#bg)"/>

  <!-- Moon Glow -->
  <circle cx="1360" cy="110" r="90" fill="url(#moonGlow)">
    <animate attributeName="r"
             values="90;100;90"
             dur="6s"
             repeatCount="indefinite"/>
  </circle>

  <!-- Moon -->
  <circle cx="1360" cy="110" r="42" fill="#F8FAFC"/>

  <!-- Stars -->
  <g fill="white">
    <circle cx="120" cy="70" r="2">
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
    </circle>

    <circle cx="260" cy="150" r="2">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>

    <circle cx="450" cy="90" r="2">
      <animate attributeName="opacity" values="1;0.3;1" dur="4s" repeatCount="indefinite"/>
    </circle>

    <circle cx="700" cy="180" r="2">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="5s" repeatCount="indefinite"/>
    </circle>

    <circle cx="900" cy="80" r="2">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.5s" repeatCount="indefinite"/>
    </circle>

    <circle cx="1100" cy="220" r="2">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3.5s" repeatCount="indefinite"/>
    </circle>

    <circle cx="1500" cy="70" r="2">
      <animate attributeName="opacity" values="1;0.3;1" dur="4.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Shooting Star -->
  <line x1="250" y1="60" x2="370" y2="150"
        stroke="white"
        stroke-width="2"
        opacity="0">
    <animate attributeName="opacity"
             values="0;1;0"
             dur="5s"
             repeatCount="indefinite"/>

    <animate attributeName="x1"
             values="250;900"
             dur="5s"
             repeatCount="indefinite"/>

    <animate attributeName="x2"
             values="370;1020"
             dur="5s"
             repeatCount="indefinite"/>
  </line>

  <!-- Name -->
  <text
      x="120"
      y="200"
      font-family="Arial, Helvetica, sans-serif"
      font-size="58"
      font-weight="700"
      fill="#FFFFFF"
      filter="url(#glow)">
      NIHARIKA SINGH
  </text>

  <!-- Subtitle -->
  <text
      x="120"
      y="255"
      font-family="Arial, Helvetica, sans-serif"
      font-size="24"
      fill="#C4B5FD">
      Building Dreams Among The Stars
  </text>

  <!-- Roles -->
  <text
      x="120"
      y="310"
      font-family="Courier New, monospace"
      font-size="20"
      fill="#CBD5E1">
      Data Analyst | AI &amp; ML Enthusiast | Software Developer
  </text>

  <!-- Quote -->
  <text
      x="120"
      y="360"
      font-family="Courier New, monospace"
      font-size="16"
      fill="#94A3B8">
      Turning ideas into intelligent solutions.
  </text>

</svg>