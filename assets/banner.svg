<svg width="1600" height="500" viewBox="0 0 1600 500" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="45%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>

    <!-- Aurora -->
    <linearGradient id="aurora" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#A78BFA" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.08"/>
    </linearGradient>

    <!-- Moon Glow -->
    <radialGradient id="moonGlow">
      <stop offset="0%" stop-color="#E9D5FF"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <filter id="textGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- Background -->
  <rect width="1600" height="500" fill="url(#bg)"/>

  <!-- Aurora -->
  <ellipse cx="800" cy="100" rx="700" ry="120" fill="url(#aurora)">
    <animateTransform
      attributeName="transform"
      type="translate"
      values="-40 0;40 0;-40 0"
      dur="12s"
      repeatCount="indefinite"/>
  </ellipse>

  <!-- Moon Glow -->
  <circle cx="1360" cy="110" r="90" fill="url(#moonGlow)">
    <animate attributeName="r"
      values="90;100;90"
      dur="6s"
      repeatCount="indefinite"/>
  </circle>

  <!-- Moon -->
  <circle cx="1360" cy="110" r="42" fill="#F8FAFC"/>

  <!-- Stars -->

  <g fill="white">

    <circle cx="120" cy="70" r="2">
      <animate attributeName="opacity" values="1;.2;1" dur="2s" repeatCount="indefinite"/>
    </circle>

    <circle cx="260" cy="150" r="2">
      <animate attributeName="opacity" values=".3;1;.3" dur="3s" repeatCount="indefinite"/>
    </circle>

    <circle cx="420" cy="90" r="1.5">
      <animate attributeName="opacity" values="1;.1;1" dur="4s" repeatCount="indefinite"/>
    </circle>

    <circle cx="640" cy="210" r="2">
      <animate attributeName="opacity" values=".2;1;.2" dur="5s" repeatCount="indefinite"/>
    </circle>

    <circle cx="820" cy="60" r="2">
      <animate attributeName="opacity" values="1;.2;1" dur="2.5s" repeatCount="indefinite"/>
    </circle>

    <circle cx="1010" cy="180" r="2">
      <animate attributeName="opacity" values=".3;1;.3" dur="4.2s" repeatCount="indefinite"/>
    </circle>

    <circle cx="1220" cy="240" r="2">
      <animate attributeName="opacity" values="1;.2;1" dur="3s" repeatCount="indefinite"/>
    </circle>

    <circle cx="1490" cy="70" r="2">
      <animate attributeName="opacity" values=".2;1;.2" dur="4s" repeatCount="indefinite"/>
    </circle>

  </g>

  <!-- Shooting Star -->

  <line
      x1="300"
      y1="60"
      x2="430"
      y2="150"
      stroke="#FFFFFF"
      stroke-width="2"
      opacity="0">

      <animate attributeName="opacity"
      values="0;1;0"
      dur="6s"
      repeatCount="indefinite"/>

      <animate attributeName="x1"
      values="300;980"
      dur="6s"
      repeatCount="indefinite"/>

      <animate attributeName="x2"
      values="430;1110"
      dur="6s"
      repeatCount="indefinite"/>

  </line>

  <!-- Name -->

  <text
      x="120"
      y="215"
      font-size="60"
      font-family="Space Grotesk"
      font-weight="700"
      fill="#F8FAFC"
      filter="url(#textGlow)">

      NIHARIKA SINGH

  </text>

  <!-- Tagline -->

  <text
      x="120"
      y="270"
      font-size="26"
      fill="#C4B5FD"
      font-family="Space Grotesk">

      Building Dreams Among The Stars ✨

  </text>

  <!-- Role -->

  <text
      x="120"
      y="325"
      font-size="19"
      fill="#CBD5E1"
      font-family="JetBrains Mono">

      • Data Analyst • AI & ML Enthusiast • Software Developer •

  </text>

  <!-- Tiny Quote -->

  <text
      x="120"
      y="385"
      font-size="16"
      fill="#94A3B8"
      font-family="JetBrains Mono">

      "Turning ideas into intelligent solutions."

  </text>

</svg>