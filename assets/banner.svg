<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500">

<defs>

<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#020617"/>
<stop offset="45%" stop-color="#0F172A"/>
<stop offset="100%" stop-color="#312E81"/>
</linearGradient>

<radialGradient id="moonGlow">
<stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
<stop offset="45%" stop-color="#C4B5FD" stop-opacity="0.6"/>
<stop offset="100%" stop-color="#C4B5FD" stop-opacity="0"/>
</radialGradient>

<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
<feGaussianBlur stdDeviation="8" result="blur1"/>
<feGaussianBlur stdDeviation="16" result="blur2"/>
<feMerge>
<feMergeNode in="blur2"/>
<feMergeNode in="blur1"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>

</defs>

<rect width="1600" height="500" fill="url(#bg)"/>

<ellipse cx="800" cy="90" rx="760" ry="140" fill="#8B5CF6" opacity="0.08">
<animate attributeName="opacity" values="0.05;0.14;0.05" dur="12s" repeatCount="indefinite"/>
</ellipse>

<circle cx="1380" cy="95" r="85" fill="url(#moonGlow)">
<animate attributeName="r" values="85;100;85" dur="6s" repeatCount="indefinite"/>
</circle>

<circle cx="1380" cy="95" r="52" fill="#F8FAFC">
<animate attributeName="opacity" values="0.96;1;0.96" dur="5s" repeatCount="indefinite"/>
</circle>

<g fill="white">
<circle cx="120" cy="70" r="2"><animate attributeName="opacity" values="1;.2;1" dur="2s" repeatCount="indefinite"/></circle>
<circle cx="240" cy="120" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/></circle>
<circle cx="340" cy="55" r="2"/>
<circle cx="460" cy="180" r="2"/>
<circle cx="620" cy="80" r="2"/>
<circle cx="770" cy="200" r="2"/>
<circle cx="920" cy="60" r="2"/>
<circle cx="1080" cy="160" r="2"/>
<circle cx="1240" cy="220" r="2"/>
<circle cx="1490" cy="70" r="2"/>
<circle cx="80" cy="260" r="1.5"/>
<circle cx="300" cy="300" r="1.5"/>
<circle cx="520" cy="250" r="1.5"/>
<circle cx="980" cy="300" r="1.5"/>
<circle cx="1500" cy="260" r="1.5"/>
</g>

<line x1="250" y1="40" x2="420" y2="150" stroke="white" stroke-width="2" opacity="0">
<animate attributeName="opacity" values="0;1;0" dur="5s" repeatCount="indefinite"/>
<animate attributeName="x1" values="250;980" dur="5s" repeatCount="indefinite"/>
<animate attributeName="x2" values="420;1150" dur="5s" repeatCount="indefinite"/>
</line>

<text x="800" y="215"
font-size="96"
font-weight="900"
font-family="Arial,Helvetica,sans-serif"
text-anchor="middle"
letter-spacing="5"
fill="#FFFFFF"
filter="url(#glow)">
NIHARIKA SINGH
<animate attributeName="opacity" values="0.82;1;0.82" dur="2.5s" repeatCount="indefinite"/>
</text>

<text x="800" y="285"
font-size="34"
font-family="Arial,Helvetica,sans-serif"
text-anchor="middle"
fill="#DDD6FE">
Building Dreams Among The Stars
</text>

<text x="800" y="340"
font-size="25"
font-family="Courier New,monospace"
text-anchor="middle"
fill="#E2E8F0">
Data Analyst • AI &amp; ML Enthusiast • Software Developer
</text>

<text x="800" y="395"
font-size="19"
font-style="italic"
font-family="Arial,Helvetica,sans-serif"
text-anchor="middle"
fill="#94A3B8">
Turning Ideas Into Intelligent Solutions.
</text>

</svg>
