<svg xmlns="http://www.w3.org/2000/svg"
width="1600"
height="90"
viewBox="0 0 1600 90">

<defs>

<linearGradient id="line"
x1="0%"
y1="0%"
x2="100%"
y2="0%">

<stop offset="0%" stop-color="#312E81"/>
<stop offset="50%" stop-color="#A855F7"/>
<stop offset="100%" stop-color="#312E81"/>

</linearGradient>

</defs>

<line
x1="120"
y1="45"
x2="1480"
y2="45"
stroke="url(#line)"
stroke-width="2">

<animate
attributeName="stroke-opacity"
values=".3;1;.3"
dur="4s"
repeatCount="indefinite"/>

</line>

<circle
cx="800"
cy="45"
r="7"
fill="#DDD6FE">

<animate
attributeName="r"
values="7;10;7"
dur="3s"
repeatCount="indefinite"/>

</circle>

</svg>