<svg xmlns="http://www.w3.org/2000/svg"
width="320"
height="320"
viewBox="0 0 320 320">

<defs>

<radialGradient id="planet">

<stop offset="0%" stop-color="#DDD6FE"/>
<stop offset="45%" stop-color="#A855F7"/>
<stop offset="100%" stop-color="#312E81"/>

</radialGradient>

<linearGradient id="ring"
x1="0%"
y1="0%"
x2="100%"
y2="0%">

<stop offset="0%" stop-color="#7C3AED"/>
<stop offset="50%" stop-color="#FFFFFF"/>
<stop offset="100%" stop-color="#7C3AED"/>

</linearGradient>

<filter id="glow">

<feGaussianBlur stdDeviation="6" result="blur"/>

<feMerge>
<feMergeNode in="blur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>

</filter>

</defs>

<!-- Background Glow -->

<circle
cx="160"
cy="160"
r="95"
fill="#7C3AED"
opacity=".18"
filter="url(#glow)">

<animate
attributeName="r"
values="95;105;95"
dur="6s"
repeatCount="indefinite"/>

</circle>

<!-- Saturn Ring -->

<ellipse

cx="160"

cy="160"

rx="120"

ry="34"

fill="none"

stroke="url(#ring)"

stroke-width="6"

opacity=".9"

transform="rotate(-18 160 160)">

<animateTransform

attributeName="transform"

type="rotate"

values="-18 160 160;-15 160 160;-18 160 160"

dur="10s"

repeatCount="indefinite"/>

</ellipse>

<!-- Planet -->

<circle

cx="160"

cy="160"

r="72"

fill="url(#planet)"

filter="url(#glow)"/>

<!-- Surface Bands -->

<path

d="M105 145 Q160 125 215 145"

stroke="#C4B5FD"

stroke-width="4"

fill="none"

opacity=".45"/>

<path

d="M100 170 Q160 190 220 170"

stroke="#DDD6FE"

stroke-width="4"

fill="none"

opacity=".35"/>

<path

d="M110 192 Q160 208 210 192"

stroke="#E9D5FF"

stroke-width="3"

fill="none"

opacity=".30"/>

<!-- Planet Highlight -->

<ellipse

cx="138"

cy="132"

rx="18"

ry="30"

fill="white"

opacity=".15">

<animate

attributeName="opacity"

values=".08;.18;.08"

dur="5s"

repeatCount="indefinite"/>

</ellipse>

<!-- Orbiting Moon -->

<circle

cx="255"

cy="160"

r="8"

fill="#FFFFFF">

<animateMotion

dur="10s"

repeatCount="indefinite"

path="M-95 0 A95 42 0 1 1 95 0 A95 42 0 1 1 -95 0"/>

</circle>

<!-- Stars -->

<g fill="white">

<circle cx="45" cy="60" r="2">
<animate attributeName="opacity" values="1;.2;1" dur="3s" repeatCount="indefinite"/>
</circle>

<circle cx="285" cy="45" r="2">
<animate attributeName="opacity" values=".2;1;.2" dur="4s" repeatCount="indefinite"/>
</circle>

<circle cx="270" cy="270" r="2">
<animate attributeName="opacity" values="1;.3;1" dur="5s" repeatCount="indefinite"/>
</circle>

<circle cx="60" cy="260" r="2">
<animate attributeName="opacity" values=".3;1;.3" dur="6s" repeatCount="indefinite"/>
</circle>

</g>

</svg>