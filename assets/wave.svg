<svg xmlns="http://www.w3.org/2000/svg"
width="1600"
height="170"
viewBox="0 0 1600 170"
preserveAspectRatio="none">

<defs>

<linearGradient id="waveGradient"
x1="0%"
y1="0%"
x2="100%"
y2="0%">

<stop offset="0%" stop-color="#312E81"/>
<stop offset="30%" stop-color="#7C3AED"/>
<stop offset="50%" stop-color="#A855F7"/>
<stop offset="70%" stop-color="#7C3AED"/>
<stop offset="100%" stop-color="#312E81"/>

</linearGradient>

<filter id="glow">

<feGaussianBlur stdDeviation="5" result="coloredBlur"/>

<feMerge>
<feMergeNode in="coloredBlur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>

</filter>

</defs>

<rect
width="1600"
height="170"
fill="transparent"/>

<!-- Main Wave -->

<path
fill="url(#waveGradient)"
filter="url(#glow)"
opacity=".35">

<animate
attributeName="d"
dur="12s"
repeatCount="indefinite"

values="

M0 90
C180 30 360 150 560 95
S930 45 1180 100
S1450 150 1600 90
L1600 170
L0 170
Z;

M0 105
C200 155 420 35 650 95
S1000 145 1260 65
S1480 25 1600 110
L1600 170
L0 170
Z;

M0 90
C180 30 360 150 560 95
S930 45 1180 100
S1450 150 1600 90
L1600 170
L0 170
Z

"/>

</path>

<!-- Second Wave -->

<path
fill="#A855F7"
opacity=".12">

<animate
attributeName="d"
dur="16s"
repeatCount="indefinite"

values="

M0 115
C260 165 470 55 690 120
S1070 175 1340 90
S1510 55 1600 110
L1600 170
L0 170
Z;

M0 80
C240 40 510 150 740 80
S1040 20 1310 125
S1500 165 1600 80
L1600 170
L0 170
Z;

M0 115
C260 165 470 55 690 120
S1070 175 1340 90
S1510 55 1600 110
L1600 170
L0 170
Z

"/>

</path>

<!-- Floating Stars -->

<g fill="#FFFFFF">

<circle cx="180" cy="40" r="2">

<animate
attributeName="opacity"
values="1;.2;1"
dur="3s"
repeatCount="indefinite"/>

</circle>

<circle cx="430" cy="70" r="2">

<animate
attributeName="opacity"
values=".3;1;.3"
dur="5s"
repeatCount="indefinite"/>

</circle>

<circle cx="770" cy="35" r="2">

<animate
attributeName="opacity"
values="1;.4;1"
dur="4s"
repeatCount="indefinite"/>

</circle>

<circle cx="1120" cy="65" r="2">

<animate
attributeName="opacity"
values=".4;1;.4"
dur="6s"
repeatCount="indefinite"/>

</circle>

<circle cx="1460" cy="45" r="2">

<animate
attributeName="opacity"
values="1;.2;1"
dur="3.5s"
repeatCount="indefinite"/>

</circle>

</g>

<!-- Cosmic Glow -->

<circle
cx="800"
cy="70"
r="8"
fill="#DDD6FE">

<animate
attributeName="r"
values="8;14;8"
dur="3s"
repeatCount="indefinite"/>

<animate
attributeName="opacity"
values=".5;1;.5"
dur="3s"
repeatCount="indefinite"/>

</circle>

</svg>