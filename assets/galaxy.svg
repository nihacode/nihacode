<svg xmlns="http://www.w3.org/2000/svg"
width="1600"
height="500"
viewBox="0 0 1600 500">

<defs>

<linearGradient id="bg"
x1="0%"
y1="0%"
x2="100%"
y2="100%">

<stop offset="0%" stop-color="#020617"/>
<stop offset="50%" stop-color="#111827"/>
<stop offset="100%" stop-color="#312E81"/>

</linearGradient>

<radialGradient id="nebula1">

<stop offset="0%" stop-color="#7C3AED" stop-opacity=".35"/>

<stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>

</radialGradient>

<radialGradient id="nebula2">

<stop offset="0%" stop-color="#3B82F6" stop-opacity=".30"/>

<stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>

</radialGradient>

</defs>

<rect
width="1600"
height="500"
fill="url(#bg)"/>

<!-- Purple Nebula -->

<circle
cx="320"
cy="120"
r="230"
fill="url(#nebula1)">

<animate
attributeName="r"
values="220;260;220"
dur="18s"
repeatCount="indefinite"/>

</circle>

<!-- Blue Nebula -->

<circle
cx="1250"
cy="340"
r="280"
fill="url(#nebula2)">

<animate
attributeName="r"
values="280;320;280"
dur="22s"
repeatCount="indefinite"/>

</circle>

<!-- Floating Clouds -->

<ellipse
cx="850"
cy="220"
rx="650"
ry="120"
fill="#A855F7"
opacity=".05">

<animate
attributeName="opacity"
values=".03;.08;.03"
dur="12s"
repeatCount="indefinite"/>

</ellipse>

<!-- Stars -->

<g fill="white">

<circle cx="90" cy="60" r="2">
<animate attributeName="opacity"
values="1;.3;1"
dur="2s"
repeatCount="indefinite"/>
</circle>

<circle cx="220" cy="180" r="2">
<animate attributeName="opacity"
values=".2;1;.2"
dur="3s"
repeatCount="indefinite"/>
</circle>

<circle cx="380" cy="80" r="2">
<animate attributeName="opacity"
values="1;.2;1"
dur="4s"
repeatCount="indefinite"/>
</circle>

<circle cx="540" cy="250" r="2">
<animate attributeName="opacity"
values=".2;1;.2"
dur="5s"
repeatCount="indefinite"/>
</circle>

<circle cx="760" cy="120" r="2">
<animate attributeName="opacity"
values="1;.4;1"
dur="4s"
repeatCount="indefinite"/>
</circle>

<circle cx="920" cy="50" r="2">
<animate attributeName="opacity"
values=".2;1;.2"
dur="3.2s"
repeatCount="indefinite"/>
</circle>

<circle cx="1080" cy="220" r="2">
<animate attributeName="opacity"
values="1;.3;1"
dur="4.8s"
repeatCount="indefinite"/>
</circle>

<circle cx="1280" cy="100" r="2">
<animate attributeName="opacity"
values=".3;1;.3"
dur="5s"
repeatCount="indefinite"/>
</circle>

<circle cx="1500" cy="70" r="2">
<animate attributeName="opacity"
values="1;.2;1"
dur="3.8s"
repeatCount="indefinite"/>
</circle>

</g>

<!-- Shooting Star -->

<line
x1="250"
y1="40"
x2="400"
y2="150"
stroke="white"
stroke-width="2"
opacity="0">

<animate
attributeName="opacity"
values="0;1;0"
dur="6s"
repeatCount="indefinite"/>

<animate
attributeName="x1"
values="250;1050"
dur="6s"
repeatCount="indefinite"/>

<animate
attributeName="x2"
values="400;1200"
dur="6s"
repeatCount="indefinite"/>

</line>

<!-- Floating Particles -->

<g fill="#DDD6FE">

<circle cx="320" cy="430" r="2">

<animate
attributeName="cy"
values="430;390;430"
dur="6s"
repeatCount="indefinite"/>

</circle>

<circle cx="620" cy="420" r="2">

<animate
attributeName="cy"
values="420;380;420"
dur="7s"
repeatCount="indefinite"/>

</circle>

<circle cx="930" cy="435" r="2">

<animate
attributeName="cy"
values="435;390;435"
dur="5s"
repeatCount="indefinite"/>

</circle>

<circle cx="1260" cy="425" r="2">

<animate
attributeName="cy"
values="425;390;425"
dur="8s"
repeatCount="indefinite"/>

</circle>

</g>

</svg>