<svg xmlns="http://www.w3.org/2000/svg"
width="1600"
height="420"
viewBox="0 0 1600 420">

<defs>

<linearGradient id="bg"
x1="0%"
y1="0%"
x2="100%"
y2="100%">

<stop offset="0%" stop-color="#020617"/>
<stop offset="100%" stop-color="#111827"/>

</linearGradient>

<filter id="glow">

<feGaussianBlur stdDeviation="4" result="blur"/>

<feMerge>
<feMergeNode in="blur"/>
<feMergeNode in="SourceGraphic"/>

</feMerge>

</filter>

</defs>

<rect
width="1600"
height="420"
fill="url(#bg)"/>

<!-- ===================== -->
<!-- CONSTELLATION LINES -->
<!-- ===================== -->

<g
stroke="#8B5CF6"
stroke-width="2"
opacity=".45">

<line x1="210" y1="120" x2="330" y2="80"/>

<line x1="330" y1="80" x2="470" y2="160"/>

<line x1="470" y1="160" x2="610" y2="110"/>

<line x1="610" y1="110" x2="760" y2="185"/>

<line x1="760" y1="185" x2="940" y2="95"/>

<line x1="940" y1="95" x2="1110" y2="145"/>

<line x1="1110" y1="145" x2="1290" y2="70"/>

<line x1="1290" y1="70" x2="1450" y2="180"/>

</g>

<!-- ===================== -->
<!-- STARS -->
<!-- ===================== -->

<g fill="white">

<circle cx="210" cy="120" r="5">
<animate attributeName="r"
values="5;7;5"
dur="3s"
repeatCount="indefinite"/>

<animate attributeName="opacity"
values=".5;1;.5"
dur="3s"
repeatCount="indefinite"/>
</circle>

<circle cx="330" cy="80" r="4">
<animate attributeName="r"
values="4;6;4"
dur="2.8s"
repeatCount="indefinite"/>
</circle>

<circle cx="470" cy="160" r="5">
<animate attributeName="opacity"
values=".3;1;.3"
dur="4s"
repeatCount="indefinite"/>
</circle>

<circle cx="610" cy="110" r="5">
<animate attributeName="r"
values="5;8;5"
dur="5s"
repeatCount="indefinite"/>
</circle>

<circle cx="760" cy="185" r="5">
<animate attributeName="opacity"
values=".2;1;.2"
dur="3.5s"
repeatCount="indefinite"/>
</circle>

<circle cx="940" cy="95" r="5">
<animate attributeName="r"
values="5;7;5"
dur="4.8s"
repeatCount="indefinite"/>
</circle>

<circle cx="1110" cy="145" r="4">
<animate attributeName="opacity"
values=".4;1;.4"
dur="3.5s"
repeatCount="indefinite"/>
</circle>

<circle cx="1290" cy="70" r="5">
<animate attributeName="r"
values="5;8;5"
dur="4s"
repeatCount="indefinite"/>
</circle>

<circle cx="1450" cy="180" r="5">
<animate attributeName="opacity"
values=".2;1;.2"
dur="5s"
repeatCount="indefinite"/>
</circle>

</g>

<!-- ===================== -->
<!-- BACKGROUND STARS -->
<!-- ===================== -->

<g fill="#FFFFFF">

<circle cx="80" cy="60" r="2"/>
<circle cx="150" cy="300" r="2"/>
<circle cx="270" cy="250" r="2"/>
<circle cx="430" cy="40" r="2"/>
<circle cx="580" cy="320" r="2"/>
<circle cx="710" cy="60" r="2"/>
<circle cx="850" cy="300" r="2"/>
<circle cx="980" cy="220" r="2"/>
<circle cx="1150" cy="320" r="2"/>
<circle cx="1250" cy="260" r="2"/>
<circle cx="1380" cy="320" r="2"/>
<circle cx="1520" cy="70" r="2"/>

</g>

<!-- ===================== -->
<!-- SHOOTING STAR -->
<!-- ===================== -->

<line
x1="180"
y1="35"
x2="300"
y2="120"
stroke="white"
stroke-width="2"
opacity="0">

<animate
attributeName="opacity"
values="0;1;0"
dur="7s"
repeatCount="indefinite"/>

<animate
attributeName="x1"
values="180;1200"
dur="7s"
repeatCount="indefinite"/>

<animate
attributeName="x2"
values="300;1320"
dur="7s"
repeatCount="indefinite"/>

</line>

<!-- ===================== -->
<!-- CENTER GLOW -->
<!-- ===================== -->

<circle
cx="800"
cy="210"
r="14"
fill="#DDD6FE"
filter="url(#glow)">

<animate
attributeName="r"
values="14;20;14"
dur="3s"
repeatCount="indefinite"/>

<animate
attributeName="opacity"
values=".4;1;.4"
dur="3s"
repeatCount="indefinite"/>

</circle>

</svg>